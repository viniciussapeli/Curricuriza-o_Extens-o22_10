<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caminho do Aprendizado - Jogo Educativo Infantil</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="bg-gradient-to-b from-sky-300 via-sky-200 to-emerald-200 min-h-screen flex flex-col justify-between overflow-x-hidden relative">
        <!-- Fundo Animado -->
        <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-yellow-300 rounded-full sun-ray animate-spin-slow opacity-90"></div>
            <div class="absolute top-8 left-1/4 text-white/80 text-6xl animate-float"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-14 right-1/4 text-white/70 text-5xl animate-float" style="animation-delay: 1.5s;"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-4 right-10 text-white/90 text-7xl animate-float" style="animation-delay: 2.5s;"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-20 left-12 text-pink-400 text-4xl animate-float" style="animation-delay: 0.8s;"><i class="fa-solid fa-balloon"></i></div>
            <div class="absolute top-32 right-16 text-yellow-400 text-3xl animate-float" style="animation-delay: 2s;"><i class="fa-solid fa-balloon"></i></div>
            <div class="absolute bottom-0 left-0 right-0 h-32 bg-emerald-500 rounded-t-[50%] scale-x-125 translate-y-12 shadow-lg"></div>
            <div class="absolute bottom-0 left-0 right-0 h-24 bg-green-600 rounded-t-[40%] scale-x-150 translate-y-8 opacity-80"></div>
        </div>

        <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-4 flex justify-between items-center">
            <button onclick="window.location.href='index.html'" class="flex items-center gap-2 bg-white/90 backdrop-blur hover:bg-white text-emerald-600 font-game px-4 py-2 rounded-2xl shadow-md transition transform active:scale-95 border-2 border-emerald-300">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="hidden sm:inline">Início</span>
            </button>
        </header>

        <main class="w-full flex flex-col items-center z-10">
            <div id="screen-home" class="w-full text-center flex flex-col items-center justify-center space-y-6">
                <div class="relative inline-block">
                    <div class="text-8xl sm:text-9xl mb-2 animate-bounce-gentle filter drop-shadow-lg">🦁</div>
                    <div class="bg-amber-100 text-amber-800 border-2 border-amber-400 px-4 py-1 rounded-full font-bold text-sm shadow animate-pulse">
                        Oi! Vamos aprender juntos?
                    </div>
                </div>

                <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border-4 border-emerald-400 max-w-md w-full">
                    <h1 class="text-3xl sm:text-4xl font-game text-emerald-600 mb-2 drop-shadow">Caminho do Aprendizado</h1>
                    <p class="text-gray-600 mb-6 font-semibold">Escolha uma categoria e divirta-se descobrindo novos conhecimentos!</p>

                    <div class="space-y-3 mb-6 text-left">
                        <label class="block font-game text-gray-700 text-sm mb-1 pt-2">Dificuldade:</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setDifficulty('facil')" id="diff-facil" class="diff-btn bg-emerald-500 text-white font-game py-2 rounded-xl border-2 border-emerald-600 shadow">Fácil</button>
                            <button onclick="setDifficulty('medio')" id="diff-medio" class="diff-btn bg-gray-200 text-gray-700 font-game py-2 rounded-xl border-2 border-gray-300 shadow">Médio</button>
                            <button onclick="setDifficulty('dificil')" id="diff-dificil" class="diff-btn bg-gray-200 text-gray-700 font-game py-2 rounded-xl border-2 border-gray-300 shadow">Difícil</button>
                        </div>
                    </div>

                    <button onclick="window.location.href='quiz.html'" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-game text-2xl py-4 rounded-2xl shadow-lg border-b-4 border-green-800 transition transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-play"></i> JOGAR
                    </button>
                </div>
            </div>
        </main>

        <footer class="relative z-10 text-center py-2 text-xs font-semibold text-emerald-900/80">
            Jogo Educativo 2026 - Unifebe 
        </footer>

        <script src="js/questoes.js"></script>
        <script src="js/nagavecao.js"></script>
        <script src="js/jogo.js"></script>
    </body>
</html>
