<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz - Jogo Educativo</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body class="bg-gradient-to-b from-sky-300 via-sky-200 to-emerald-200 min-h-screen flex flex-col justify-between overflow-x-hidden relative">
        <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-yellow-300 rounded-full sun-ray animate-spin-slow opacity-90"></div>
            <div class="absolute top-8 left-1/4 text-white/80 text-6xl animate-float"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-14 right-1/4 text-white/70 text-5xl animate-float" style="animation-delay: 1.5s;"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-4 right-10 text-white/90 text-7xl animate-float" style="animation-delay: 2.5s;"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-20 left-12 text-pink-400 text-4xl animate-float" style="animation-delay: 0.8s;"><i class="fa-solid fa-balloon"></i></div>
            <div class="absolute top-32 right-16 text-yellow-400 text-3xl animate-float" style="animation-delay: 2s;"><i class="fa-solid fa-balloon"></i></div>
            <div class="absolute bottom-0 left-0 right-0 h-32 bg-emerald-500 rounded-t-[50%] scale-x-125 translate-y-12 shadow-lg"></div>
            <div class="absolute bottom-0 left-0 right-0 h-24 bg-green-600 rounded-t-[40%] scale-x-150 translate-y-8 opacity-80"></div>
        </div>

        <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-4 flex justify-between items-center">
            <button onclick="window.location.href='index.html'" class="flex items-center gap-2 bg-white/90 backdrop-blur hover:bg-white text-emerald-600 font-game px-4 py-2 rounded-2xl shadow-md transition transform active:scale-95 border-2 border-emerald-300">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="hidden sm:inline">Início</span>
            </button>
        </header>

        <main class="w-full flex flex-col items-center z-10 h-full justify-center">
            <div id="screen-quiz" class="w-full max-w-2xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-2xl border-4 border-amber-300 relative flex flex-col my-auto">
                <div id="header-progress" class="w-full bg-gray-200 rounded-full h-3 mb-4">
                    <div id="header-progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                
                <div class="flex justify-between items-center mb-3 border-b-2 border-amber-100 pb-2">
                    <span id="question-level-badge" class="bg-amber-400 text-amber-900 font-game text-xs sm:text-sm px-3 py-1 rounded-full uppercase tracking-wider">Questão nível Fácil</span>
                    <span id="question-counter" class="font-game text-gray-500 text-sm">Pergunta 1 de 10</span>
                </div>

                <h2 id="question-text" class="text-xl sm:text-2xl font-game text-gray-800 text-center my-2">Pergunta aqui?</h2>

                <div id="question-media-container" class="my-3 min-h-[120px] flex items-center justify-center bg-sky-50 rounded-2xl border-2 border-dashed border-sky-200 p-3">
                </div>

                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
                </div>
            </div>
        </main>

        <div id="modal-correct" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-emerald-50 border-4 border-emerald-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl animate-bounce-gentle">
                <div class="text-6xl mb-3">🌟</div>
                <h3 class="text-2xl font-game text-emerald-700 mb-2">Parabéns!</h3>
                <p class="text-emerald-800 font-semibold text-base mb-6">Você acertou a questão! Continue assim, você está indo muito bem!</p>
                <button onclick="nextQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-game text-xl py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 transition transform active:scale-95">
                    Próximo <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <div id="modal-incorrect" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
            <div class="bg-rose-50 border-4 border-rose-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                <div class="text-6xl mb-3">💬</div>
                <h3 class="text-2xl font-game text-rose-700 mb-2">Ops!</h3>
                <p class="text-rose-800 font-semibold text-base mb-6">Você errou essa questão, mas tudo bem! Errar faz parte de aprender!</p>
                <button onclick="nextQuestion()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-game text-xl py-3 rounded-2xl shadow-lg border-b-4 border-amber-700 transition transform active:scale-95">
                    Próximo <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <footer class="relative z-10 text-center py-2 text-xs font-semibold text-emerald-900/80">
            Jogo Educativo 2026 - Unifebe 
        </footer>

        <script src="js/questoes.js"></script>
        <script src="js/nagavecao.js"></script>
        <script src="js/jogo.js"></script>
    </body>
</html>
